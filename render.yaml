services:
  - type: web
    name: jaydeep-portfolio-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://portfolio-web-eosin-alpha-93.vercel.app
